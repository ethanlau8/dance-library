<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- interactive-widget=resizes-content makes the on-screen keyboard shrink the
         layout viewport, so bottom-anchored sheets sit above it instead of behind
         it. Safari ignores it; useKeyboardInset covers that case in JS. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <title>Dance Library</title>
  </head>
  <body>
    <div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
  </body>
</html>
